[theme]
base = "light"
font = "sans-serif"
baseFontSize = 15
baseRadius = "10px"
buttonRadius = "8px"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false

[theme.light]
primaryColor = "#136EE0"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#EEF2F7"
textColor = "#17212B"
linkColor = "#136EE0"
borderColor = "#CBD5E1"
dataframeHeaderBackgroundColor = "#E2E8F0"

[theme.dark]
primaryColor = "#136EE0"
backgroundColor = "#081318"
secondaryBackgroundColor = "#10252B"
textColor = "#E8F1F2"
linkColor = "#5EA0F2"
borderColor = "#29444B"
dataframeHeaderBackgroundColor = "#17343B"

[theme.light.sidebar]
backgroundColor = "#EEF2F7"
secondaryBackgroundColor = "#E2E8F0"
textColor = "#17212B"
borderColor = "#CBD5E1"
primaryColor = "#136EE0"

[theme.dark.sidebar]
backgroundColor = "#0C1D22"
secondaryBackgroundColor = "#163037"
textColor = "#E8F1F2"
borderColor = "#29444B"
primaryColor = "#136EE0"
